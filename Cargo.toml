[package]
name = "montana-solitaire"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
iced = { version = "0.14.0", features = ["canvas"] }
rand = "0.10.2"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
wasm-bindgen = "0.2.100"
console_error_panic_hook = "0.1.7"
